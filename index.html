<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barcelona | Roteiro de Viagem 2026</title>
<meta name="theme-color" content="#0b2f55">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--blue:#0d6fe8;--blue2:#0758bd;--navy:#0c2d52;--ink:#14263a;--muted:#64748b;--red:#ef3340;--orange:#f97316;--violet:#7c3aed;--line:#dce6f0;--soft:#f4f8fc;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef4f8;color:var(--ink)}button,a{font:inherit}
.hero{height:158px;position:relative;overflow:hidden;color:white;background:#163a5b url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Panoramic%20View%20of%20the%20Bas%C3%ADlica%20de%20la%20Sagrada%20Fam%C3%ADlia.jpg?width=2000') center 58%/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,20,39,.68) 0%,rgba(3,20,39,.26) 52%,rgba(3,20,39,.10) 100%)}
.hero-inner{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px clamp(22px,4vw,58px)}
.brand{display:flex;align-items:center;gap:18px;min-width:0}.flag{width:76px;height:50px;border-radius:12px;box-shadow:0 5px 16px #0006;overflow:hidden;display:grid;grid-template-rows:1fr 2fr 1fr;flex:none}.flag i:nth-child(1),.flag i:nth-child(3){background:#aa151b}.flag i:nth-child(2){background:#f1bf00;position:relative}
.brand h1{font:700 clamp(44px,6vw,72px)/.9 Georgia,"Times New Roman",serif;margin:0;text-shadow:0 3px 14px #0009;letter-spacing:-2px}.brand p{margin:9px 0 0 5px;font-weight:750;text-transform:uppercase;letter-spacing:6px;font-size:12px;text-shadow:0 2px 8px #000}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.legend button{border:1px solid #ffffff24;color:white;background:rgba(7,35,63,.84);backdrop-filter:blur(5px);padding:10px 13px;border-radius:22px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}.legend button:hover,.legend button.active{background:#0d6fe8;border-color:#8bc2ff;transform:translateY(-1px)}
.days{display:flex;gap:12px;overflow-x:auto;padding:11px clamp(16px,3vw,34px);background:white;box-shadow:0 3px 15px #15324d14;position:sticky;top:0;z-index:1000}.days::-webkit-scrollbar{height:0}.days button{border:1px solid #dbe6f0;background:#f4f8fc;color:#173a62;border-radius:17px;min-width:176px;padding:10px 17px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:.2s}.days button>span:last-child{display:flex;flex-direction:column;gap:4px;min-width:0}.days button:hover{transform:translateY(-1px)}.days button.active{color:white;border-color:transparent;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 7px 18px #0d6fe833}.cal{font-size:23px}.date{display:block;font-weight:900;font-size:17px;line-height:1.1;white-space:nowrap}.weekday{display:block;font-size:11px;line-height:1.2;opacity:.9;white-space:nowrap}
.app{display:grid;grid-template-columns:minmax(330px,420px) 1fr;min-height:calc(100vh - 224px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px;overflow:auto;max-height:calc(100vh - 224px)}.dayhead{border-radius:20px;padding:18px;margin-bottom:13px;background:linear-gradient(135deg,#f9fbfd,#e8f5ff);border:1px solid #e2edf5}.dayhead .big{font:700 35px/1 Georgia,serif;color:#123b66}.dayhead h2{font-size:17px;margin:8px 0 5px}.dayhead p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.hotel{display:flex;align-items:center;gap:12px;background:#122f4b;color:white;border-radius:15px;padding:12px 14px;margin:11px 0 14px}.type-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:50%;background:var(--blue);font-size:18px;flex:none}.hotel b{font-size:14px}.hotel small{display:block;margin-top:3px;opacity:.8}
.stop{display:grid;grid-template-columns:46px 66px minmax(0,1fr) 28px;align-items:center;gap:9px;padding:11px 9px;border-bottom:1px solid #e8eef4;cursor:pointer;border-radius:13px;transition:.18s}.stop:hover,.stop.selected{background:#f1f7ff}.stop-thumb{width:66px;height:52px;object-fit:cover;border-radius:10px;background:#e8eef4;box-shadow:0 2px 8px #0001}.stop .badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:white;font-weight:900;box-shadow:0 3px 8px #0002}.stop .stopname{display:block;font-weight:850;font-size:14px;line-height:1.25;padding-right:4px}.stop .stoptxt{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.25}.chev{font-size:25px;color:#31485f;text-align:center}
.mapwrap{position:relative;min-width:0}#map{height:calc(100vh - 224px);min-height:520px;background:#dbe9f4}.map-title{position:absolute;z-index:700;left:16px;top:15px;background:white;border-radius:15px;padding:8px 12px;box-shadow:0 5px 18px #18354f2a;font-size:12px;font-weight:800;color:#173a62;pointer-events:none}
.marker-pin{width:42px;height:42px;border-radius:50% 50% 50% 7px;transform:rotate(-45deg);background:var(--red);border:3px solid white;box-shadow:0 5px 13px #0005;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}.marker-pin span{transform:rotate(45deg)}
.leaflet-popup-content-wrapper{padding:0!important;border-radius:20px!important;overflow:hidden;box-shadow:0 14px 42px #10243b40!important}.leaflet-popup-content{margin:0!important;width:292px!important}.leaflet-popup-tip{box-shadow:none}.popup-photo{height:150px;width:100%;object-fit:cover;display:block;background:linear-gradient(135deg,#dce8f2,#eef4f8)}.popup-info{padding:16px 17px 15px}.popup-title{display:flex;align-items:center;gap:10px;margin-bottom:8px}.popup-num{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--red);color:#fff;font-weight:900}.popup-title b{font:700 18px/1.18 Georgia,"Times New Roman",serif;color:#10243b}.popup-info p{margin:0 0 12px;color:#566575;font-size:13px;line-height:1.45}.go{display:block;text-align:center;padding:11px 13px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white!important;text-decoration:none;font-weight:850}.photo-fallback{height:150px;display:grid;place-items:center;background:linear-gradient(135deg,#dce8f2,#f5f8fb);font-size:38px}
.credit{font-size:10px;color:#718096;padding:10px 2px 2px;line-height:1.4}
@media(max-width:900px){.hero{height:132px;background-position:58% 55%}.hero-inner{padding:16px 18px}.flag{width:58px;height:39px}.brand{gap:12px}.brand h1{font-size:44px}.brand p{font-size:9px;letter-spacing:3px}.legend{display:none}.days{padding:9px 10px;gap:8px}.days button{min-width:132px;padding:9px 11px}.date{font-size:15px}.weekday{font-size:10px}.cal{font-size:19px}.app{display:flex;flex-direction:column}.mapwrap{order:1}#map{height:53vh;min-height:390px}.sidebar{order:2;max-height:none;overflow:visible;padding:14px}.map-title{top:10px;left:10px}.leaflet-popup-content{width:260px!important}.popup-photo{height:126px}.popup-info{padding:14px 15px}.popup-title b{font-size:17px}}
@media(max-width:520px){.stop{grid-template-columns:42px 58px minmax(0,1fr) 22px;padding:9px 5px}.stop-thumb{width:58px;height:48px}.stop .badge{width:36px;height:36px}.stop .stopname{font-size:13px}.stop .stoptxt{font-size:11px}}
@media(max-width:420px){.hero{height:118px}.brand h1{font-size:39px}.brand p{letter-spacing:2.2px}.flag{width:51px;height:35px;border-radius:9px}.days button{min-width:123px}.leaflet-popup-content{width:242px!important}.popup-photo{height:115px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><div class="brand"><div class="flag" aria-label="Bandeira de Espanha"><i></i><i></i><i></i></div><div><h1>Barcelona</h1><p>Roteiro de viagem 2026</p></div></div><div class="legend"><button type="button" id="hotelBtn">🏨 Hotel</button><button type="button" id="visitsBtn">📷 Visitas</button><button type="button" id="airportBtn">✈️ Aeroporto</button></div></div></header>
<nav class="days" id="days"></nav>
<div class="app"><aside class="sidebar"><div id="content"></div></aside><section class="mapwrap"><div class="map-title">🗺️ Mapa interativo</div><div id="map"></div></section></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const hotel={name:"ibis Barcelona Santa Coloma",lat:41.455661,lng:2.204926};
const IMG={
hotel:"https://ik.imagekit.io/etg/hb/22/228426/228426a_hb_a_029.jpg?tr=f-auto,q-80,fo-auto,w-900,h-560",
airport:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Barcelona-T1-exterior.jpg?width=1000",
parkguell:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Hauptportal%20des%20Parc%20G%C3%BCell.jpg?width=900",
vicens:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Casa%20Vicens%20in%20Barcelona%202026.jpg?width=900",
sagrada:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Sagrada%20Fam%C3%ADlia.%20Fa%C3%A7ana%20del%20Naixement.jpg?width=900",
arc:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Barcelona%20-%20Arc%20de%20Triomf%20%282%29.JPG?width=900",
ciutadella:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Ciutadella%20Park%20fountain.jpg?width=900",
moco:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Moco%20Museum%20Barcelona%20Patio.jpg?width=900",
gothic:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Barri%20Gotic%2C%20Barcelona%20%28P1170658%29.jpg?width=900",
cathedral:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Barcelona.%20Cathedral%20church%20of%20the%20Holy%20Cross%20and%20Saint%20Eulalia.%20Neo-Gothic%20facade.%20Jesus%20Christ%20Saviour%20of%20the%20World.%201887-1890.%20Agapit%20Vallmitjana%2C%20sculptor%20%2828007233922%29.jpg?width=900",
boqueria:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Mercat%20de%20la%20Boqueria.jpg?width=900",
barceloneta:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Platja%20de%20la%20Barceloneta%20%2828702911413%29.jpg?width=900",
pedrera:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Casa%20Mila%2C%20Barcelona.jpg?width=900",
batllo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Casa%20Batll%C3%B3%2C%20Barcelona.jpg?width=900",
montjuic:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Barcelona%20-%20Montju%C3%AFc%20-%20Passeig%20de%20Santa%20Madrona%20-%20Panorama%20View%20towards%20the%20Sagrada%20Fam%C3%ADlia%2001.jpg?width=900"
};
const days=[
{id:1,date:"19 Out",weekday:"Segunda-feira",title:"✈️ Chegada a Barcelona",description:"Chegada prevista por volta das 21:00. Deslocação para Santa Coloma de Gramenet e check-in.",points:[
{n:1,name:"Aeroporto Barcelona–El Prat",lat:41.2974,lng:2.0833,d:"Chegada a Barcelona e início da deslocação para o hotel.",img:IMG.airport},
{n:2,name:"ibis Barcelona Santa Coloma",lat:41.455661,lng:2.204926,d:"Hotel e base da viagem.",img:IMG.hotel}]},
{id:2,date:"20 Out",weekday:"Terça-feira",title:"🏛️ Gaudí + Sagrada Família",description:"Dia organizado por proximidade, começando em Gràcia e terminando na Sagrada Família.",points:[
{n:3,name:"Park Güell",lat:41.4145,lng:2.1527,d:"Parque de Gaudí e um dos locais mais emblemáticos de Barcelona.",img:IMG.parkguell},
{n:4,name:"Casa Vicens",lat:41.4035,lng:2.1506,d:"Uma das primeiras grandes obras de Antoni Gaudí.",img:IMG.vicens},
{n:5,name:"Sagrada Família",lat:41.4036,lng:2.1744,d:"Basílica emblemática de Barcelona e obra-prima de Gaudí.",img:IMG.sagrada}]},
{id:3,date:"21 Out",weekday:"Quarta-feira",title:"🏙️ Centro histórico + Barceloneta",description:"Percurso desde o Arc de Triomf, passando pelo Born e Bairro Gótico, até ao mar.",points:[
{n:6,name:"Arc de Triomf",lat:41.3911,lng:2.1806,d:"Monumento que marca o início do percurso pelo centro histórico.",img:IMG.arc},
{n:7,name:"Parc de la Ciutadella",lat:41.3881,lng:2.1860,d:"Grande parque urbano junto ao Born.",img:IMG.ciutadella},
{n:8,name:"Moco Museum Barcelona",lat:41.3852,lng:2.1809,d:"Museu de arte moderna e contemporânea.",img:IMG.moco},
{n:9,name:"Bairro Gótico",lat:41.3837,lng:2.1761,d:"Ruas históricas e praças do centro antigo.",img:IMG.gothic},
{n:10,name:"Catedral de Barcelona",lat:41.3839,lng:2.1762,d:"Catedral no coração do Bairro Gótico.",img:IMG.cathedral},
{n:11,name:"Mercat de la Boqueria",lat:41.3817,lng:2.1716,d:"Mercado histórico junto à Rambla.",img:IMG.boqueria},
{n:12,name:"Praia de Barceloneta",lat:41.3784,lng:2.1925,d:"Final do percurso junto ao Mediterrâneo.",img:IMG.barceloneta}]},
{id:4,date:"22 Out",weekday:"Quinta-feira",title:"🏠 Modernismo + Montjuïc",description:"Passeig de Gràcia pela manhã e Montjuïc para terminar o dia.",points:[
{n:13,name:"La Pedrera · Casa Milà",lat:41.3954,lng:2.1619,d:"Obra modernista de Gaudí no Passeig de Gràcia.",img:IMG.pedrera},
{n:14,name:"Casa Batlló",lat:41.3917,lng:2.1649,d:"Uma das obras mais reconhecíveis de Gaudí.",img:IMG.batllo},
{n:15,name:"Montjuïc",lat:41.3636,lng:2.1585,d:"Zona elevada com jardins, miradouros e equipamentos culturais.",img:IMG.montjuic}]},
{id:5,date:"23 Out",weekday:"Sexta-feira",title:"✈️ Regresso",description:"Voo às 12:00. Manhã reservada à saída do hotel e deslocação para o aeroporto.",points:[
{n:16,name:"ibis Barcelona Santa Coloma",lat:41.455661,lng:2.204926,d:"Saída do hotel com antecedência.",img:IMG.hotel},
{n:17,name:"Aeroporto Barcelona–El Prat",lat:41.2974,lng:2.0833,d:"Destino final do roteiro.",img:IMG.airport}]}
];
const map=L.map("map",{zoomControl:true}).setView([41.39,2.17],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let active=1,markers=[],route=null;
const directions=p=>"https://www.google.com/maps/dir/?api=1&destination="+p.lat+","+p.lng;
function pin(n){return L.divIcon({className:"",html:`<div class="marker-pin"><span>${n}</span></div>`,iconSize:[42,42],iconAnchor:[21,38],popupAnchor:[0,-34]})}
function safeImg(p){return p.img?`<img class="popup-photo" src="${p.img}" alt="${p.name}" onerror="this.outerHTML='<div class=&quot;photo-fallback&quot;>📷</div>'">`:`<div class="photo-fallback">${p.name.includes('ibis')?'🏨':'📷'}</div>`}
function popup(p){return `${safeImg(p)}<div class="popup-info"><div class="popup-title"><span class="popup-num">${p.n}</span><b>${p.name}</b></div><p>${p.d}</p><a class="go" target="_blank" rel="noopener" href="${directions(p)}">📍 Direções</a></div>`}
function clearMap(){markers.forEach(m=>map.removeLayer(m));markers=[];if(route){map.removeLayer(route);route=null}}
function clearTopActive(){document.querySelectorAll('.legend button').forEach(b=>b.classList.remove('active'))}
function focusSpecial(kind){clearTopActive();clearMap();document.querySelectorAll('.stop').forEach(x=>x.classList.remove('selected'));
 if(kind==='hotel'){document.getElementById('hotelBtn').classList.add('active');const p={n:'🏨',name:hotel.name,lat:hotel.lat,lng:hotel.lng,d:'Hotel e base da viagem em Santa Coloma de Gramenet.',img:IMG.hotel};const m=L.marker([p.lat,p.lng],{icon:pin('H')}).addTo(map).bindPopup(popup(p));markers=[m];map.flyTo([p.lat,p.lng],15,{duration:.6});setTimeout(()=>m.openPopup(),350);}
 if(kind==='airport'){document.getElementById('airportBtn').classList.add('active');const p={n:'✈',name:'Aeroporto Barcelona–El Prat',lat:41.2974,lng:2.0833,d:'Aeroporto de chegada e partida da viagem.',img:IMG.airport};const m=L.marker([p.lat,p.lng],{icon:pin('✈')}).addTo(map).bindPopup(popup(p));markers=[m];map.flyTo([p.lat,p.lng],14,{duration:.6});setTimeout(()=>m.openPopup(),350);}
 if(kind==='visits'){document.getElementById('visitsBtn').classList.add('active');const pts=days.filter(d=>d.id>=2&&d.id<=4).flatMap(d=>d.points);const coords=[];pts.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:pin(p.n)}).addTo(map).bindPopup(popup(p),{maxWidth:292});markers.push(m);coords.push([p.lat,p.lng])});map.fitBounds(L.latLngBounds(coords),{padding:[55,55],maxZoom:13});}
}
function renderDays(){const nav=document.getElementById('days');nav.innerHTML='';days.forEach(d=>{const b=document.createElement('button');b.className=d.id===active?'active':'';b.innerHTML=`<span class="cal">▣</span><span><span class="date">${d.date}</span><span class="weekday">${d.weekday}</span></span>`;b.addEventListener('click',()=>{clearTopActive();active=d.id;renderDays();renderDay()});nav.appendChild(b)})}
function renderDay(){const d=days.find(x=>x.id===active);clearMap();let html=`<div class="dayhead"><div class="big">${d.date}</div><h2>${d.weekday}</h2><p><b>${d.title}</b><br>${d.description}</p></div>`;if(active>1&&active<5)html+=`<div class="hotel"><span class="type-icon">🏨</span><span><b>${hotel.name}</b><small>Base da viagem</small></span></div>`;const coords=[];d.points.forEach((p,i)=>{const m=L.marker([p.lat,p.lng],{icon:pin(p.n)}).addTo(map).bindPopup(popup(p),{maxWidth:292,closeButton:true});markers.push(m);coords.push([p.lat,p.lng]);html+=`<div class="stop" data-i="${i}" role="button" tabindex="0"><span class="badge">${p.n}</span>${p.img?`<img class="stop-thumb" src="${p.img}" alt="" onerror="this.style.display=\'none\'">`:`<div class="stop-thumb" style="display:grid;place-items:center;font-size:24px">${p.name.includes('ibis')?'🏨':'📍'}</div>`}<span><span class="stopname">${p.name}</span><span class="stoptxt">${p.d}</span></span><span class="chev">›</span></div>`});html+=`<div class="credit">Fotografias dos locais: Wikimedia Commons. O botão “Direções” abre o destino no Google Maps.</div>`;document.getElementById('content').innerHTML=html;if(coords.length>1){route=L.polyline(coords,{color:'#1479e8',weight:3,opacity:.45,dashArray:'7 9'}).addTo(map);map.fitBounds(L.latLngBounds(coords),{padding:[55,55],maxZoom:14})}else if(coords.length)map.setView(coords[0],14);document.querySelectorAll('.stop').forEach(el=>{const open=()=>{const i=+el.dataset.i;document.querySelectorAll('.stop').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');map.flyTo(coords[i],15,{duration:.55});setTimeout(()=>markers[i].openPopup(),300)};el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});setTimeout(()=>map.invalidateSize(),120)}
document.getElementById('hotelBtn').addEventListener('click',()=>focusSpecial('hotel'));document.getElementById('visitsBtn').addEventListener('click',()=>focusSpecial('visits'));document.getElementById('airportBtn').addEventListener('click',()=>focusSpecial('airport'));
renderDays();renderDay();
</script>
<footer style="padding:7px 16px;background:#fff;color:#718096;font-size:9px;text-align:center">Imagens: Wikimedia Commons · Licenças e autores disponíveis nas páginas de origem.</footer>
</body>
</html>
